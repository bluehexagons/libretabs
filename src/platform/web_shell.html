<!DOCTYPE html>
<!-- Godot 4.7.2 template, MIT. See assets/fonts/Godot-template-LICENSE.txt.
Modifications: omit the uncached optional splash image; establish initial
service-worker control before boot so the first usable session can cache fully. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			setStatusMode('progress');
			(async () => {
				let registration = await navigator.serviceWorker.getRegistration();
				if (registration == null) {
					await engine.installServiceWorker();
					registration = await navigator.serviceWorker.ready;
				} else {
					await registration.update();
					await navigator.serviceWorker.ready;
				}
				// Registration can become active before controllerchange reaches this
				// document. Reload once either way; a controlled navigation receives
				// the isolation headers and will take the normal boot branch.
				window.location.reload();
			})().catch((err) => {
				displayFailureNotice('Could not prepare the browser player. Reload this page or try the compatibility player.\n' + err.message);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Resolve the offline release before exposing any import controls.
		// A denied/timed-out registration still permits an online-only session.
		async function prepareOfflineBoot() {
			if (!GODOT_CONFIG.serviceWorker || !('serviceWorker' in navigator)) return true;
			const before = navigator.serviceWorker.controller;
			let active = before;
			let newerRelease = false;
			try {
				await Promise.race([
					(async () => {
						const registration = await navigator.serviceWorker.register(GODOT_CONFIG.serviceWorker, {updateViaCache: 'none'});
						await registration.update();
						const installing = registration.installing;
						if (installing) await new Promise(resolve => {
							const settled = () => {
								if (['activated', 'redundant'].includes(installing.state)) {
									installing.removeEventListener('statechange', settled);
									resolve();
								}
							};
							installing.addEventListener('statechange', settled);
							settled();
						});
						await navigator.serviceWorker.ready;
						active = registration.active;
						// Activation can precede controllerchange delivery, or happen
						// between this document's navigation and this boot script.
						if (navigator.serviceWorker.controller) await new Promise(resolve => {
							const channel = new MessageChannel();
							const timeout = setTimeout(() => { channel.port1.close(); resolve(); }, 500);
							channel.port1.onmessage = event => {
								clearTimeout(timeout);
								channel.port1.close();
								newerRelease = !!event.data.activeRelease && event.data.release !== event.data.activeRelease;
								resolve();
							};
							navigator.serviceWorker.controller.postMessage('libretabs-offline-status', [channel.port2]);
						});
					})(),
					new Promise((_, reject) => setTimeout(() => reject(new Error('Offline setup timed out')), 5000)),
				]);
				if (!before || active !== before || navigator.serviceWorker.controller !== before || newerRelease) { location.reload(); return false; }
			} catch (_) { /* Keep the last complete release usable offline or on a slow connection. */ }
			return true;
		}
		prepareOfflineBoot().then((ready) => {
		if (!ready) return;
		return engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
		});
	}
}());
		</script>
	</body>
</html>
