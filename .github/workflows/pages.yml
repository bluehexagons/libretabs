# SPDX-License-Identifier: Apache-2.0
name: Publish project guide
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy the guide to Pages (off builds a preview artifact only)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build the instructional site
        env:
          PLAYER_URL: ${{ vars.PLAYER_URL }}
          ITCH_URL: ${{ vars.ITCH_URL }}
        run: |
          python3 -m unittest discover -s tests -p test_site.py
          python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
          retention-days: 1
  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
