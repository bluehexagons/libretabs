# SPDX-License-Identifier: Apache-2.0
name: Deploy GitHub Pages
on:
  workflow_call:
    inputs:
      release_version:
        description: 'Version displayed in the guide and linked from downloads'
        required: false
        default: ''
        type: string
      deploy:
        description: 'Deploy after building the Pages artifact'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional published prototype version shown in the guide'
        required: false
        default: ''
        type: string
      deploy:
        description: 'Deploy the guide and players (off builds a preview artifact only)'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test site tooling
        run: python3 -m unittest discover -s tests -p test_site.py
      - name: Install locked Godot and web templates
        run: python3 scripts/install_toolchain.py --directory "$RUNNER_TEMP/godot" --templates --targets web
      - name: Export threaded and compatibility players
        run: |
          python3 scripts/export_web.py --preset Web --output "$RUNNER_TEMP/pages-threaded"
          python3 scripts/export_web.py --preset 'Web single-thread comparison' --output "$RUNNER_TEMP/pages-compatible"
      - name: Build instructional site with players
        env:
          PLAYER_URL: ${{ vars.PLAYER_URL }}
          ITCH_URL: ${{ vars.ITCH_URL }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 scripts/build_site.py \
            --threaded-player "$RUNNER_TEMP/pages-threaded" \
            --compatibility-player "$RUNNER_TEMP/pages-compatible"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
          retention-days: 1
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
