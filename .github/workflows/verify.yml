# SPDX-License-Identifier: Apache-2.0
name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Godot (no export templates)
        run: python3 scripts/install_toolchain.py --directory "$RUNNER_TEMP/godot"
      - name: Verify
        run: python3 scripts/verify.py
      - name: Generated inputs reproduce exactly
        run: |
          python3 scripts/generate_fixtures.py
          python3 scripts/prepare_export.py
          git diff --exit-code
