# SPDX-License-Identifier: Apache-2.0
name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: 'Also run optional broad UI and editor audits'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select supported Node.js for browser adapter tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned Godot (no export templates)
        run: python3 scripts/install_toolchain.py --directory "$RUNNER_TEMP/godot"
      - name: Verify
        run: python3 scripts/verify.py --full
      - name: Optional UI and editor audits
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: python3 scripts/verify.py --suite ui-audit --suite editor
      - name: Generated inputs reproduce exactly
        run: |
          python3 scripts/generate_fixtures.py
          python3 scripts/prepare_export.py
          git diff --exit-code
